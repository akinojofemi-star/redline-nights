# Online game server. Deploy with: cd server && npx wrangler deploy   (after a one-time: npx wrangler login)
name = "redline-nights"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
