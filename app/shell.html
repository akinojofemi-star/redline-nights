<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Racing Heritage</title>
<!-- added to a phone's home screen it opens full screen, with no browser bars (the only full screen an iPhone allows) -->
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e0a16">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Heritage">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Saira+Condensed:ital,wght@1,700;1,900&display=swap">
<style>
/* The lobby sits over the game (which keeps running its showroom behind it), in the same look as the game's menus. */
:root{--ink:#0e0a16;--hud:#f6efe4;--dim:rgba(246,239,228,.62);--nitro:#ffb02e;--perfect:#3fc8ff;--shock:#b678ff;--danger:#ff3d5a;--ok:#5ee08a;
  --panel:rgba(14,10,22,.86);--line:rgba(255,255,255,.16);--f-ui:"Chakra Petch",system-ui,sans-serif;--f-display:"Saira Condensed",Impact,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--hud);font-family:var(--f-ui);overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#lobby{position:fixed;inset:0;display:flex;align-items:stretch;pointer-events:none}
#lobby[hidden]{display:none}
.card{pointer-events:auto;width:min(560px,100%);height:100%;overflow:auto;padding:28px 30px 40px;background:linear-gradient(90deg,var(--panel) 75%,rgba(14,10,22,.0))}
h1{margin:0 0 4px;font:900 italic 54px/0.9 var(--f-display);letter-spacing:.01em}
h1 span{display:block;color:var(--nitro)}
h2{margin:22px 0 10px;font:900 italic 24px var(--f-display);letter-spacing:.03em}
.lbl{font:700 11px var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.tag{color:var(--dim);font-size:14px;line-height:1.5;margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{height:40px;padding:0 12px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--hud);font:600 15px var(--f-ui);outline:none}
input:focus,select:focus{border-color:var(--nitro)}
select option{background:#1a1424}
input.code{width:150px;text-transform:uppercase;letter-spacing:.3em;font-weight:700}
button{height:40px;padding:0 18px;border:1px solid var(--line);background:transparent;color:var(--hud);font:700 13px var(--f-ui);letter-spacing:.12em;cursor:pointer;text-transform:uppercase}
button:hover{border-color:var(--hud)}
button.go{height:52px;padding:0 30px;background:var(--nitro);color:var(--ink);border:0;font:900 italic 26px var(--f-display);letter-spacing:.06em;transform:skewX(-10deg)}
button.go:disabled{opacity:.4;cursor:default}
button.on{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--dim);font-size:12px}
.sw{width:22px;height:22px;flex:none;border:2px solid rgba(255,255,255,.4)}
.pill{font:700 10px var(--f-ui);letter-spacing:.14em;padding:3px 7px;border:1px solid currentColor}
.ready{color:var(--ok)}.wait{color:var(--dim)}.hosttag{color:var(--nitro)}
.bigcode{font:900 italic 56px/1 var(--f-display);letter-spacing:.12em;color:var(--nitro)}
.msg{margin-top:10px;font-size:14px;color:var(--dim)}
.msg.err{color:var(--danger)}
.paints{display:flex;flex-wrap:wrap;gap:6px}
.steer{display:grid;grid-template-columns:1fr 3.2em;gap:12px;align-items:center}.steer input{accent-color:#ffb02e;width:100%}.steer b{text-align:right}
.paints button{width:28px;height:28px;padding:0;border:2px solid rgba(255,255,255,.25)}
.paints button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px}
.hint{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:12px;margin-top:10px}
.stats span{letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stats em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right;min-width:7ch}
.stats .bar{height:8px;background:rgba(255,255,255,.1);transform:skewX(-18deg);position:relative;overflow:hidden}
.stats .bar i{position:absolute;inset:0 auto 0 0;background:var(--hud)}
.sep{height:1px;background:var(--line);margin:20px 0}
</style></head>
<body>
<iframe id="game" title="Racing Heritage" allow="autoplay; fullscreen"></iframe>
<div id="lobby"><div class="card" id="card"></div></div>
<script>
(() => {
'use strict';
// ---------------------------------------------------------------- state
const VER = '1.12';                           // multiplayer protocol: only matching versions can play together
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const APP = !!window.rn;                     // inside the desktop app (LAN hosting available)
const WEB_URL = 'https://akinojofemi-star.github.io/redline-nights/';   // the browser version, for invite links
const DOWNLOAD_URL = 'https://github.com/akinojofemi-star/redline-nights/releases/latest';
const inviteLink = code => (APP ? WEB_URL : location.origin + location.pathname.replace(/index\.html$/, '')) + '#join=' + code;
const AI_NAMES = ['Vega', 'Kaito', 'Rook', 'Mila', 'Dax'];
const S = {
  screen: 'home', name: store.get('rn-name') || 'Driver' + Math.floor(100 + Math.random() * 900),
  car: store.get('rn-mp-car') || 'p911', paint: +(store.get('rn-mp-paint') || 0), ready: false,
  info: null,                                 // cars, paints and maps, from the game when it loads
  lan: new Map(),                             // LAN games heard on the network
  net: null,                                  // the connection (host hub or client)
  lobby: null,                                // {players, settings, racing} as the host last sent it
  msg: '', err: false, curMap: null, mpLoaded: false, pendingStart: null,
  invite: (/join=([A-Za-z0-9]{5})/.exec(location.hash) || [])[1] || null   // opened from an invite link
};
if (S.invite) { S.invite = S.invite.toUpperCase(); history.replaceState(null, '', location.pathname + location.search); }
let settings = { map: 'city', laps: 3, ai: 2, slip: true, contact: true, knock: true };
window.__lobby = S;                         // for tests
try { Object.assign(settings, JSON.parse(store.get('rn-mp-settings') || '{}')); } catch (e) {}

// ---------------------------------------------------------------- the game frame
const frame = $('game');
// a fresh query each time: changing only the #map part wouldn't reload the page, and the old map would stay up
let loads = 0;
function loadGame(map, mp) { S.curMap = map; S.mpLoaded = mp; frame.src = 'game.html?' + (mp ? 'mp=1&' : '') + 'n=' + (++loads) + '#' + map; }
function toggleFullscreen() {
  if (APP) return rn.toggleFullscreen();
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const rq = el.requestFullscreen || el.webkitRequestFullscreen; if (rq) { const p = rq.call(el); if (p && p.catch) p.catch(() => {}); } }
}
function toGame(m) { if (frame.contentWindow) frame.contentWindow.postMessage(m, '*'); }
addEventListener('message', e => {
  if (e.source !== frame.contentWindow) return;
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.t === 'ready') {
    S.info = { cars: m.cars, paints: m.paints, maps: m.maps };
    if (!S.info.cars.some(c => c.id === S.car)) S.car = S.info.cars[0].id;
    if (S.net && S.net.room) toGame({ t: 'clock', off: S.net.room.off });
    if (S.pendingStart) { const c = S.pendingStart; S.pendingStart = null; toGame({ t: 'start', cfg: c }); }
    if (S.screen !== 'race') render();
  } else if (m.t === 'openLobby') { show(true); go('home'); }
  else if (m.t === 'fs') toggleFullscreen();                  // the game's own full screen button
  else if (m.t === 'loaded') {                                   // our game has the race set up and is holding on the grid
    if (!S.net) return;
    if (S.net.isHost) hubLoaded('H'); else S.net.send({ t: 'loaded', race: S.raceId });
  }
  else if (m.t === 'lobby') { S.screen = S.net ? 'lobby' : 'home'; show(true); if (S.net && S.net.isHost) { S.net.racing = false; broadcastLobby(); } render(); }
  else if (m.t === 'st' || m.t === 'fin' || m.t === 'ev') {      // our own car's news: share it
    if (!S.net) return;
    const out = Object.assign({}, m, { id: m.id || S.net.myId, byName: S.name });
    if (S.net.isHost) S.net.broadcast(out); else S.net.shout(out);
  }
});
function show(on) { $('lobby').hidden = !on; }

// ---------------------------------------------------------------- networking: one host hub, any number of clients
// Everyone in a game connects to a room: the Racing Heritage game server for online games (found by room code), or the
// desktop app's relay for LAN games. Both route messages between players with the same small protocol (server/
// worker.js, lan.js). The host's lobby is the hub: it keeps the player list and settings and starts races. Car states
// go from each player straight to everyone else through the room; everything else goes to or from the host.
const SERVER = (/[?&]server=([^&#]+)/.exec(location.search) || [])[1]
  ? decodeURIComponent(/[?&]server=([^&#]+)/.exec(location.search)[1]) : 'wss://redline-nights.akinojofemi.workers.dev';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const clock = () => performance.timeOrigin + performance.now();

// A connection to a room. It also keeps our offset from the room's clock (the best of the last eight pings), which
// the game uses to draw other cars where they are right now.
function openRoom(url, role, h) {
  let ws; try { ws = new WebSocket(url); } catch (e) { setTimeout(() => h.onError('unreachable')); return null; }
  const room = { id: null, open: false, ended: false, rtt: 0, off: 0 }, samples = [];
  const raw = m => { if (ws.readyState === 1) ws.send(JSON.stringify(m)); };
  const ping = () => raw({ type: 'ping', c: clock() });
  let pinger = null;
  room.send = (to, data, except) => raw({ type: 'send', to, data, except });
  room.close = () => { room.ended = true; clearInterval(pinger); try { ws.close(); } catch (e) {} };
  ws.onopen = () => raw({ type: 'hello', role });
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.type === 'msg') h.onMsg(m.from, m.data);
    else if (m.type === 'pong') {
      const now = clock(), rtt = now - m.c; samples.push({ rtt, off: m.s + rtt / 2 - now }); if (samples.length > 8) samples.shift();
      const best = samples.reduce((a, b) => (b.rtt < a.rtt ? b : a)); room.rtt = Math.round(rtt); room.off = best.off;
      toGame({ t: 'clock', off: room.off }); const el = $('ping'); if (el) el.textContent = room.rtt + ' ms';
    }
    else if (m.type === 'welcome') { room.id = m.id; room.open = true; ping(); pinger = setInterval(ping, 2000); h.onWelcome(m.id); }
    else if (m.type === 'join') { if (h.onJoin) h.onJoin(m.id); }
    else if (m.type === 'leave') { if (h.onLeave) h.onLeave(m.id); }
    else if (m.type === 'closed') { room.ended = true; h.onClosed(m.why); }
    else if (m.type === 'error') { room.ended = true; h.onError(m.msg); }
  };
  ws.onclose = () => { clearInterval(pinger); if (!room.ended) { room.ended = true; if (room.open) h.onDrop(); else h.onError('unreachable'); } };
  return room;
}
// handlers only act while that connection is still the current one
const forNet = (net, h) => Object.fromEntries(Object.entries(h).map(([k, f]) => [k, (...a) => { if (S.net === net) f(...a); }]));

function hostGame(kind) {
  const hub = { isHost: true, myId: 'H', kind, clients: new Set(), players: new Map(), racing: false, code: null, lanIPs: [], room: null };
  hub.sendTo = (id, d) => hub.room && hub.room.send(id, d);
  hub.broadcast = (d, except) => hub.room && hub.room.send('*', d, except);
  hub.close = () => { if (hub.room) hub.room.close(); if (kind === 'lan' && APP) rn.hostStop(); };
  hub.players.set('H', { id: 'H', name: S.name, car: S.car, paint: S.paint, ready: true, host: true });
  S.net = hub; S.lobby = null; go('lobby');
  const h = forNet(hub, {
    onWelcome: () => { if (kind === 'lan') rn.hostUpdate(beaconInfo()); render(); },
    onMsg: hubMsg, onJoin: id => hub.clients.add(id), onLeave: hubLeave,
    onClosed: why => fail(why),
    onError: msg => {
      if (msg === 'taken' && kind === 'online') return connect();        // that code is in use: pick another
      fail(kind === 'online' ? 'Couldn’t reach the game server. Check your internet connection and try again.'
        : 'LAN hosting is unavailable (is another game already hosting on this computer?)');
    },
    onDrop: () => fail(kind === 'online' ? 'Lost the connection to the game server.' : 'The LAN game stopped.')
  });
  const connect = () => {
    if (kind === 'online') { hub.code = newCode(); hub.room = openRoom(SERVER + '/room/' + hub.code, 'host', h); }
    else rn.hostStart(beaconInfo()).then(r => { if (S.net !== hub) return; hub.lanIPs = r.ips; hub.room = openRoom('ws://127.0.0.1:' + r.port, 'host', h); render(); });
  };
  connect(); render();
}
function beaconInfo() {
  const hub = S.net;
  return { v: VER, name: S.name + "'s game", players: hub ? hub.players.size : 1, map: settings.map };
}
function lobbyFor(id) {
  const hub = S.net;
  return { t: 'lobby', you: id, players: [...hub.players.values()], settings, racing: hub.racing };
}
function broadcastLobby() {
  const hub = S.net; if (!hub || !hub.isHost) return;
  for (const id of hub.clients) hub.sendTo(id, lobbyFor(id));
  if (APP && hub.kind === 'lan') rn.hostUpdate(beaconInfo());
  render();
}
function hubMsg(id, d) {
  const hub = S.net; if (!hub || !d) return;
  if (d.t === 'hello') {
    if (d.v !== VER) { hub.sendTo(id, { t: 'closed', why: 'Version mismatch: the host has ' + VER + ', you have ' + d.v + '. Everyone needs the same version.' }); return; }
    if (hub.players.size >= 6 && !hub.players.has(id)) { hub.sendTo(id, { t: 'closed', why: 'That game is full (6 drivers).' }); return; }
    hub.clients.add(id);
    if (!hub.players.has(id)) hub.players.set(id, { id, name: String(d.name || 'Driver').slice(0, 16), car: d.car, paint: d.paint | 0, ready: false });
    broadcastLobby();
  } else if (d.t === 'me') {
    const p = hub.players.get(id); if (!p) return;
    Object.assign(p, { name: String(d.name || p.name).slice(0, 16), car: d.car, paint: d.paint | 0, ready: !!d.ready });
    broadcastLobby();
  } else if (d.t === 'loaded') {
    if (hub.race && d.race === hub.race.cfg.race) hubLoaded(id);
  } else if (d.t === 'st' || d.t === 'fin' || d.t === 'ev') toGame(stamp(id, d));   // the room already sent it to everyone
}
// a player's own news carries their room id; only the host speaks for the AI cars
function stamp(from, d) { const out = Object.assign({}, d); if (from !== 'H') { out.id = from; delete out.ai; } return out; }
function hubLeave(id) {
  const hub = S.net; if (!hub || !hub.clients.has(id)) return;
  hub.clients.delete(id); hub.players.delete(id);
  hub.broadcast({ t: 'left', id }); toGame({ t: 'left', id });
  broadcastLobby(); checkGo(hub);
}
function hostStart() {
  const hub = S.net; if (!hub || !hub.isHost) return;
  hub.players.get('H').car = S.car; hub.players.get('H').paint = S.paint;
  const humans = [...hub.players.values()];
  const cls = (S.info.cars.find(c => c.id === S.car) || {}).cls;
  const pool = S.info.cars.filter(c => c.cls === cls);
  const ai = [];
  for (let i = 0; i < Math.min(settings.ai, 6 - humans.length); i++)
    ai.push({ id: 'ai' + i, name: AI_NAMES[i], car: pool[(i + 1) % pool.length].id, paint: (i * 3 + 2) % S.info.paints.length, ai: true });
  const cfg = { map: settings.map, laps: settings.laps, rules: { slip: settings.slip, contact: settings.contact, knock: settings.knock },
    players: humans.map(p => ({ id: p.id, name: p.name, car: p.car, paint: p.paint })).concat(ai) };
  cfg.race = Date.now();
  const race = hub.race = { cfg, loaded: new Set(), go: false };
  hub.racing = true;
  hub.broadcast({ t: 'start', cfg });
  startLocal(cfg);
  broadcastLobby();
  // everyone loads the map, then the countdown starts for all at once. Re-send the start to anyone who hasn't
  // reported in; after 25 s go anyway and let stragglers join when they're ready.
  const resend = setInterval(() => {
    if (hub.race !== race || race.go || S.net !== hub) return clearInterval(resend);
    for (const p of cfg.players) if (!p.ai && p.id !== 'H' && !race.loaded.has(p.id) && hub.clients.has(p.id)) hub.sendTo(p.id, { t: 'start', cfg });
  }, 3000);
  setTimeout(() => { if (hub.race === race && !race.go && S.net === hub) raceGo(hub); }, 25000);
}
function hubLoaded(id) {
  const hub = S.net, race = hub && hub.race; if (!race) return;
  race.loaded.add(id);
  if (race.go) { if (id !== 'H') hub.sendTo(id, { t: 'go', at: race.at }); return; }
  checkGo(hub);
}
function checkGo(hub) {
  const race = hub.race; if (!race || race.go) return;
  const waiting = race.cfg.players.filter(p => !p.ai && (p.id === 'H' || hub.clients.has(p.id)) && !race.loaded.has(p.id));
  if (!waiting.length) raceGo(hub);
}
// the green light is a moment on the room's clock a little over three seconds away, so every countdown ends together
function raceGo(hub) {
  const at = Math.round(clock() + (hub.room ? hub.room.off : 0) + 3200);
  hub.race.go = true; hub.race.at = at; hub.broadcast({ t: 'go', at }); toGame({ t: 'go', at });
}

// joining: kind 'online' with a room code, or 'lan' with the host's address
function joinRoom(kind, target, label) {
  const online = kind === 'online';
  if (online) { target = target.trim().toUpperCase(); if (!/^[A-Z0-9]{5}$/.test(target)) return fail('Room codes are 5 letters and numbers.'); }
  const url = online ? SERVER + '/room/' + target : 'ws://' + (target.includes(':') ? target : target + ':47800');
  const net = { isHost: false, myId: null, kind, label: online ? target : (label || target), room: null };
  net.send = d => net.room && net.room.send('host', d);            // to the host
  net.shout = d => net.room && net.room.send('*', d);              // to everyone (our car's news)
  net.close = () => net.room && net.room.close();
  S.net = net; S.lobby = null; S.err = false; S.msg = online ? 'Joining room ' + target + '…' : 'Connecting to ' + net.label + '…'; go('lobby');
  net.room = openRoom(url, 'client', forNet(net, {
    onWelcome: id => { net.myId = id; net.send(helloMsg()); },
    onMsg: clientMsg,
    onClosed: why => fail(why || 'The host closed the game.'),
    onError: msg => fail(msg === 'no-room' ? (online ? 'No game with room code ' + target + '. Check the code with the host, and that they’re still in the lobby.' : 'That game has closed.')
      : msg !== 'unreachable' ? msg
      : online ? 'Couldn’t reach the game server. Check your internet connection and try again.'
      : 'Couldn’t reach ' + net.label + '. Check the address, that you’re on the same network, and that the host’s firewall allows Racing Heritage.'),
    onDrop: () => fail(online ? 'Lost the connection to the game server.' : 'Lost the connection to the host.')
  }));
}
const helloMsg = () => ({ t: 'hello', v: VER, name: S.name, car: S.car, paint: S.paint });
function sendMe() { if (S.net && !S.net.isHost) S.net.send({ t: 'me', name: S.name, car: S.car, paint: S.paint, ready: S.ready }); }
function clientMsg(from, d) {
  if (!d) return;
  if (d.t === 'st' || d.t === 'fin' || d.t === 'ev') return toGame(stamp(from, d));
  if (from !== 'H') return;                                     // everything else only comes from the host
  if (d.t === 'lobby') { S.net.myId = d.you; S.lobby = d; settings = Object.assign(settings, d.settings); S.msg = ''; if (S.screen === 'lobby') render(); }
  else if (d.t === 'start') { if (S.raceId === d.cfg.race) return; S.raceId = d.cfg.race; startLocal(d.cfg); }
  else if (d.t === 'go') toGame({ t: 'go', at: d.at });
  else if (d.t === 'left') toGame(d);
  else if (d.t === 'closed') fail(d.why || 'The host closed the game.');
}
function fail(text) {
  const net = S.net; S.net = null; S.lobby = null; S.ready = false;
  if (net) try { net.close(); } catch (e) {}
  if (S.screen === 'race' || S.mpLoaded) toGame({ t: 'menu' });
  S.msg = text; S.err = true; show(true); go('home');
}
function leave() {
  const net = S.net; S.net = null; S.lobby = null; S.ready = false;
  if (net) net.close();
  toGame({ t: 'menu' }); S.msg = ''; go('home');
}

// ---------------------------------------------------------------- starting a race on this machine
function startLocal(cfg) {
  const mine = Object.assign({}, cfg, { me: S.net.myId, host: S.net.isHost, off: S.net.room ? S.net.room.off : 0 });
  S.screen = 'race'; show(false); frame.focus();
  if (cfg.map !== S.curMap || !S.mpLoaded) { S.pendingStart = mine; loadGame(cfg.map, true); }
  else toGame({ t: 'start', cfg: mine });
}

// ---------------------------------------------------------------- LAN games heard on the network
if (APP) rn.onLanHost(h => {
  if (h.mine) return;
  S.lan.set(h.ip + ':' + h.port, Object.assign(h, { seen: Date.now() }));
  if (S.screen === 'home') renderLan();
});
setInterval(() => { let ch = false; for (const [k, h] of S.lan) if (Date.now() - h.seen > 4000) { S.lan.delete(k); ch = true; } if (ch && S.screen === 'home') renderLan(); }, 1500);

// ---------------------------------------------------------------- screens
function go(screen) { S.screen = screen; render(); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const mapName = id => ((S.info && S.info.maps.find(m => m.id === id)) || { name: id }).name;
const carName = id => ((S.info && S.info.cars.find(c => c.id === id)) || { name: id }).name;
const paintHex = i => S.info ? S.info.paints[(i | 0) % S.info.paints.length][1] : '#888';

// the chosen car's stats, the same bars as the game's own menu (the game sends them with its car list)
function carStats(c) {
  if (!c || !c.stats) return '';
  return `<div class="stats">${c.stats.map(([k, f, v]) => `<span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(f * 100)}%"></i></div><em>${esc(v)}</em>`).join('')}</div>`
    + (c.blurb ? `<div class="hint">${esc(c.blurb)}</div>` : '');
}
function render() {
  if (document.activeElement && document.activeElement.id === 'steer') { S.later = true; return; } // don't yank the slider mid-drag
  const c = $('card');
  if (S.screen === 'home') c.innerHTML = homeHTML();
  else if (S.screen === 'lobby') c.innerHTML = lobbyHTML();
  wire();
}
function homeHTML() {
  if (S.invite) return `<h1>Racing<span>Heritage</span></h1>
  <p class="tag">You’ve been invited to race in room <b style="color:var(--nitro)">${esc(S.invite)}</b>.</p>
  <div class="lbl">Your name</div>
  <div class="row"><input id="name" maxlength="16" value="${esc(S.name)}"></div>
  <div class="row" style="margin-top:18px"><button class="go" id="joinInvite">JOIN RACE</button><button id="noInvite">Not now</button></div>
  <div class="msg ${S.err ? 'err' : ''}">${esc(S.msg)}</div>`;
  return `<h1>Racing<span>Heritage</span></h1>
  <p class="tag">Race solo, with friends anywhere online, or on the same network.</p>
  <div class="lbl">Your name</div>
  <div class="row"><input id="name" maxlength="16" value="${esc(S.name)}"></div>
  <div class="row" style="margin-top:18px"><button class="go" id="solo">PLAY SOLO</button></div>
  <div class="msg ${S.err ? 'err' : ''}">${esc(S.msg)}</div>
  <div class="sep"></div>
  <h2>Online</h2>
  <p class="tag" style="margin-top:0">Friends anywhere, through the Racing Heritage game server. Works in the browser and the app.</p>
  <div class="row" style="margin-top:12px"><button class="go" id="hostOnline" style="background:var(--perfect)">HOST ONLINE</button></div>
  <div class="lbl">Join with a room code</div>
  <div class="row"><input id="code" class="code" maxlength="5" placeholder="CODE"><button id="joinCode">Join</button></div>
  <div class="sep"></div>
  <h2>LAN</h2>
  ${APP ? `<p class="tag" style="margin-top:0">Same Wi-Fi or network: you connect straight to each other, no internet needed.</p>
  <div class="row" style="margin-top:12px"><button class="go" id="hostLan" style="background:var(--shock)">HOST LAN</button></div>
  <div class="lbl">Games on your network</div><div class="list" id="lanList"></div>
  <div class="lbl">Or by address</div>
  <div class="row"><input id="addr" placeholder="192.168.1.20" style="width:220px"><button id="joinAddr">Join</button></div>
  <p class="hint">By address also works through a virtual LAN such as Tailscale or ZeroTier.</p>`
  : `<p class="tag" style="margin-top:0">LAN games (same network, no internet needed) run in the <a href="${DOWNLOAD_URL}" target="_blank" rel="noopener" style="color:var(--perfect)">desktop app</a> for Windows, Mac and Linux. Browser players can join anyone online.</p>`}
  <div class="sep"></div>
  <div class="row"><button id="fs">Full screen</button>${APP ? '<span class="hint" style="margin:0">or press F11</span>' : ''}</div>`;
}
function renderLan() {
  const el = $('lanList'); if (!el) return;
  const list = [...S.lan.values()];
  el.innerHTML = list.length ? list.map(h => `<div class="item"><div class="grow"><b>${esc(h.name)}</b><small>${esc(h.ip)} · ${h.players}/6 drivers · ${esc(mapName(h.map))}${h.v !== VER ? ' · different version' : ''}</small></div>
    <button data-lan="${esc(h.ip + ':' + h.port)}">Join</button></div>`).join('')
    : '<div class="hint">Looking for games… a friend hosting on the same Wi-Fi or network shows up here.</div>';
  el.querySelectorAll('[data-lan]').forEach(b => b.onclick = () => { const h = S.lan.get(b.dataset.lan); joinRoom('lan', b.dataset.lan, h && h.name); });
}
function lobbyHTML() {
  const net = S.net; if (!net) return homeHTML();
  const host = net.isHost;
  const players = host ? [...net.players.values()] : (S.lobby ? S.lobby.players : []);
  if (!host && !S.lobby) return `<h1>Racing<span>Heritage</span></h1><div class="msg">${esc(S.msg)}</div><div class="row" style="margin-top:16px"><button id="leave">Cancel</button></div>`;
  const racing = host ? net.racing : S.lobby.racing;
  const cars = S.info ? S.info.cars : [];
  const myCls = (cars.find(c => c.id === S.car) || {}).cls || 'A';
  const classes = [...new Set(cars.map(c => c.cls))];
  let head;
  const ready = net.room && net.room.open;
  const pingTag = `<span class="hint" style="margin:0">${net.kind === 'online' ? 'Server' : 'Host'} ping <b id="ping">${ready && net.room.rtt ? net.room.rtt + ' ms' : '…'}</b></span>`;
  if (host && net.kind === 'online') head = `<div class="lbl">Online game · room code</div>
    <div class="row"><span class="bigcode">${ready ? esc(net.code) : '…'}</span>${ready ? '<button id="copy">Copy code</button><button id="copyLink">Copy invite link</button>' : ''}</div>
    <div class="row hint">${ready ? 'Friends type this code under Online, or open the invite link (it plays in the browser). ' + pingTag : 'Connecting to the game server…'}</div>`;
  else if (host) head = `<div class="lbl">LAN game</div>
    <div class="tag">${ready ? 'Friends on the same Wi-Fi or network see this game in their LAN list, or join at <b>' + net.lanIPs.map(esc).join('</b> or <b>') + '</b>' : 'Starting…'}</div>`;
  else head = `<div class="lbl">${net.kind === 'online' ? 'Online · room ' + esc(net.label) : 'LAN · ' + esc(net.label)}</div><div class="row hint">${pingTag}</div>`;
  const plist = players.map(p => `<div class="item"><span class="sw" style="background:${paintHex(p.paint)}"></span>
    <div class="grow"><b>${esc(p.name)}${p.id === net.myId ? ' (you)' : ''}</b><small>${esc(carName(p.car))}</small></div>
    ${p.host ? '<span class="pill hosttag">HOST</span>' : p.ready ? '<span class="pill ready">READY</span>' : '<span class="pill wait">PICKING</span>'}</div>`).join('');
  const st = settings;
  const setHTML = host ? `<div class="lbl">Race</div>
    <div class="grid2"><select id="map">${(S.info ? S.info.maps : []).map(m => `<option value="${m.id}" ${m.id === st.map ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    <select id="laps">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === st.laps ? 'selected' : ''}>${n} lap${n > 1 ? 's' : ''}</option>`).join('')}</select>
    <select id="ai">${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === st.ai ? 'selected' : ''}>${n ? n + ' AI rival' + (n > 1 ? 's' : '') : 'No AI rivals'}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:10px;gap:18px">
      <label class="check"><input type="checkbox" id="slip" ${st.slip ? 'checked' : ''}>Slipstream</label>
      <label class="check"><input type="checkbox" id="contact" ${st.contact ? 'checked' : ''}>Contact</label>
      <label class="check"><input type="checkbox" id="knock" ${st.knock ? 'checked' : ''}>Knockdowns</label></div>`
    : `<div class="lbl">Race</div><div class="tag">${esc(mapName(st.map))} · ${st.laps} lap${st.laps > 1 ? 's' : ''} · ${st.ai ? st.ai + ' AI' : 'no AI'} · ${[st.slip && 'slipstream', st.contact && 'contact', st.contact && st.knock && 'knockdowns'].filter(Boolean).join(', ') || 'no contact'}</div>`;
  return `<h1>Racing<span>Heritage</span></h1>${head}
  <div class="lbl">Drivers ${players.length}/6</div><div class="list">${plist}</div>
  ${setHTML}
  <div class="lbl">Your car</div>
  <div class="grid2"><select id="cls">${classes.map(k => `<option ${k === myCls ? 'selected' : ''}>${k}</option>`).join('')}</select>
  <select id="car">${cars.filter(c => c.cls === myCls).map(c => `<option value="${c.id}" ${c.id === S.car ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
  ${carStats(cars.find(c => c.id === S.car))}
  <div class="lbl">Paint</div><div class="paints" id="paints">${(S.info ? S.info.paints : []).map(([n, h], i) => `<button title="${esc(n)}" style="background:${h}" aria-pressed="${i === S.paint}" data-p="${i}"></button>`).join('')}</div>
  <div class="lbl">Steering sensitivity</div><div class="steer"><input type="range" id="steer" min="50" max="160" step="10" value="${steerPct()}"><b id="steerVal">${steerPct()}%</b></div>
  <div class="row" style="margin-top:22px">
    ${host ? `<button class="go" id="start" ${S.info ? '' : 'disabled'}>START RACE</button>` : `<button class="${S.ready ? 'on' : ''}" id="ready">${S.ready ? 'Ready' : 'I’m ready'}</button><span class="hint">${racing ? 'A race is on: you’ll join the next one.' : 'Waiting for the host to start.'}</span>`}
    <button id="leave">Leave</button></div>
  <div class="msg ${S.err ? 'err' : ''}">${esc(S.msg)}</div>`;
}
// shared with the game (same storage key), which picks up a change straight away, even mid-race
const steerPct = () => Math.round(Math.min(1.6, Math.max(.5, +(store.get('rn-steer') || 1) || 1)) * 100);
function wire() {
  const on = (id, ev, fn) => { const el = $(id); if (el) el[ev] = fn; };
  on('name', 'oninput', e => { S.name = e.target.value.trim() || 'Driver'; store.set('rn-name', S.name); });
  on('solo', 'onclick', () => { S.msg = ''; show(false); S.screen = 'solo'; loadGame(store.get('rn-map') || 'city', false); });
  on('hostOnline', 'onclick', () => { S.msg = ''; S.err = false; hostGame('online'); });
  on('hostLan', 'onclick', () => { S.msg = ''; S.err = false; hostGame('lan'); });
  on('joinCode', 'onclick', () => joinRoom('online', $('code').value));
  on('code', 'onkeydown', e => { if (e.key === 'Enter') joinRoom('online', e.target.value); });
  on('joinAddr', 'onclick', () => { const a = $('addr').value.trim(); if (a) joinRoom('lan', a, a); });
  on('leave', 'onclick', leave);
  on('steer', 'oninput', e => { store.set('rn-steer', e.target.value / 100); $('steerVal').textContent = e.target.value + '%'; });
  on('steer', 'onchange', e => { e.target.blur(); if (S.later) { S.later = false; render(); } });
  const copied = (id, text) => on(id, 'onclick', e => {
    const b = e.target, label = b.textContent;
    const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = label; }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(text()).then(done, () => prompt('Copy this:', text())); else prompt('Copy this:', text());
  });
  copied('copy', () => S.net.code);
  copied('copyLink', () => inviteLink(S.net.code));
  on('joinInvite', 'onclick', () => { const c = S.invite; S.invite = null; S.msg = ''; S.err = false; joinRoom('online', c); });
  on('noInvite', 'onclick', () => { S.invite = null; render(); });
  on('fs', 'onclick', toggleFullscreen);
  const setChanged = () => { store.set('rn-mp-settings', JSON.stringify(settings)); broadcastLobby(); };
  on('map', 'onchange', e => { settings.map = e.target.value; setChanged(); });
  on('laps', 'onchange', e => { settings.laps = +e.target.value; setChanged(); });
  on('ai', 'onchange', e => { settings.ai = +e.target.value; setChanged(); });
  for (const k of ['slip', 'contact', 'knock']) on(k, 'onchange', e => { settings[k] = e.target.checked; setChanged(); });
  const carChanged = () => {
    store.set('rn-mp-car', S.car); store.set('rn-mp-paint', String(S.paint));
    if (S.net && S.net.isHost) { const me = S.net.players.get('H'); me.car = S.car; me.paint = S.paint; me.name = S.name; broadcastLobby(); } else { sendMe(); render(); }
  };
  on('cls', 'onchange', e => { const c = S.info.cars.find(c => c.cls === e.target.value); if (c) { S.car = c.id; carChanged(); } });
  on('car', 'onchange', e => { S.car = e.target.value; carChanged(); });
  const paints = $('paints'); if (paints) paints.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.paint = +b.dataset.p; carChanged(); });
  on('ready', 'onclick', () => { S.ready = !S.ready; sendMe(); render(); });
  on('start', 'onclick', hostStart);
  if (S.screen === 'home') renderLan();
}

// ---------------------------------------------------------------- boot: the game's showroom runs behind the lobby
loadGame(store.get('rn-map') || 'city', true);
render();
})();
</script>
</body></html>
